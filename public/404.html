<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 — Ritesh Dhakulkar</title>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@1,9..144,300;1,9..144,400&family=Outfit:wght@400;600&family=JetBrains+Mono:wght@400&display=swap');
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0B0C10;
        color: #EDE8E3;
        font-family: 'Outfit', sans-serif;
        text-align: center;
        padding: 2rem;
      }
      .ghost {
        font-family: 'Fraunces', serif;
        font-size: clamp(8rem, 20vw, 14rem);
        font-weight: 700;
        font-style: italic;
        color: transparent;
        -webkit-text-stroke: 1px #252836;
        line-height: 1;
        letter-spacing: -0.04em;
        user-select: none;
        margin-bottom: -1rem;
      }
      h1 {
        font-family: 'Fraunces', serif;
        font-size: clamp(1.5rem, 4vw, 2.5rem);
        font-weight: 300;
        font-style: italic;
        margin-bottom: 0.75rem;
        color: #EDE8E3;
      }
      p {
        font-size: 0.95rem;
        color: #6B6F7D;
        margin-bottom: 2rem;
        line-height: 1.7;
      }
      .mono {
        font-family: 'JetBrains Mono', monospace;
        font-size: 0.65rem;
        letter-spacing: 0.14em;
        color: #E8924A;
        text-transform: uppercase;
        margin-bottom: 0.5rem;
        display: block;
      }
      a {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.75rem 1.75rem;
        background: #E8924A;
        color: #fff;
        border-radius: 0.75rem;
        font-size: 0.875rem;
        font-weight: 600;
        text-decoration: none;
        transition: background 0.2s;
      }
      a:hover { background: #D4803A; }
    </style>
  </head>
  <body>
    <div>
      <div class="ghost">404</div>
      <span class="mono">// page_not_found</span>
      <h1>This page doesn't exist.</h1>
      <p>Looks like you've ventured into uncharted territory.<br/>Let's get you back home.</p>
      <a href="/">← Back to Portfolio</a>
    </div>
  </body>
</html>
